<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky Runner</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a1226;--gold:#ffb81f;--jade:#2fd18b;--ember:#ff4d3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--ink);overflow:hidden;font-family:"Trebuchet MS",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
#w{position:relative;height:100%;overflow:hidden}
canvas{width:100%;height:100%;display:block;touch-action:none}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;background:rgba(6,10,24,.55);text-align:center}
.ov.on{display:flex}
h1{font:400 clamp(44px,13vw,86px)/.9 Bungee,Impact,sans-serif;margin:0;background:linear-gradient(#ffe27a,#ff9d1c 60%,#c4510c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #3a1500) drop-shadow(0 0 18px rgba(255,150,30,.5))}
h2{font:400 28px Bungee,Impact,sans-serif;margin:0}
.tag{letter-spacing:.2em;font-size:13px;color:#ffd98a;margin:0 0 14px}
button{font:400 18px Bungee,Impact,sans-serif;border:0;border-radius:14px;padding:14px 26px;color:#fff;background:#24324f;cursor:pointer;min-width:200px}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.go{background:linear-gradient(#ffc83a,#f08a00);color:#2b1400;font-size:30px;padding:16px 50px;box-shadow:0 5px 0 #8a4a00}
.gr{background:linear-gradient(#35d98f,#139b62);box-shadow:0 4px 0 #0a5c3a}
.bl{background:linear-gradient(#2f7bd8,#1a4f9e);box-shadow:0 4px 0 #0e2f63}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.row button{min-width:0;font-size:13px;padding:10px 14px}
.card{background:rgba(10,18,38,.9);border:1px solid #3b6fd0;border-radius:16px;padding:16px 22px;min-width:240px;text-align:left;line-height:1.9}
.card b{float:right;margin-left:24px}
#bank{position:absolute;top:12px;left:14px;font:400 18px Bungee,Impact,sans-serif;color:var(--gold)}
#pb{position:absolute;top:10px;right:10px;min-width:0;width:44px;height:40px;padding:0;font-size:18px;display:none;background:rgba(10,18,38,.7)}
#pu{position:absolute;right:8px;bottom:84px;display:none;flex-direction:column;gap:8px}
#pu button{min-width:0;width:66px;padding:8px 2px;font:400 10px Bungee,Impact,sans-serif;background:rgba(10,18,38,.72);border:1px solid #5b7bb8;position:relative}
#pu button i{display:block;font-style:normal;font-size:24px}
#pu b{position:absolute;top:-6px;right:-4px;background:var(--ember);border-radius:10px;padding:1px 6px;font-size:11px}
#pad{position:absolute;left:0;right:0;bottom:12px;display:none;justify-content:center;gap:10px}
#pad button{min-width:0;width:54px;height:50px;padding:0;font-size:20px;background:rgba(10,18,38,.6);border:1px solid #5b7bb8}
body.pl #pb,body.pl #pad,body.pl #pu{display:flex}
body.pl #bank{display:none}
#toast{position:absolute;top:96px;left:50%;transform:translateX(-50%);background:rgba(10,18,38,.9);border:1px solid var(--jade);padding:8px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="w">
<canvas id="c"></canvas>
<div id="bank"></div>
<button id="pb" aria-label="Pause">❚❚</button>
<div id="pu"><button data-u="m"><i>🧲</i>Magnet<b>1</b></button><button data-u="s"><i>🛡️</i>Shield<b>1</b></button><button data-u="b"><i>⚡</i>Boost<b>1</b></button></div>
<div id="pad"><button data-a="L" aria-label="Left">◀</button><button data-a="U" aria-label="Jump">▲</button><button data-a="D" aria-label="Slide">▼</button><button data-a="R" aria-label="Right">▶</button></div>
<div id="toast"></div>

<div class="ov on" id="menu"><h1>SKY<br>RUNNER</h1><p class="tag">NO END. JUST RUN.</p>
<button class="go" id="play">PLAY</button><button class="gr" id="cont">Continue</button>
<div class="row"><button id="daily">🎁 Daily Reward</button><button id="set">⚙ Settings</button><button id="lb">🏆 Leaderboard</button></div></div>

<div class="ov" id="pause"><h2>Game Paused</h2><div class="card">Distance<b id="pd"></b><br>Coins<b id="pc"></b><br>Time<b id="pt"></b></div>
<button class="gr" id="save">Save Progress</button><button class="bl" id="res">Resume</button><button id="mm">Main Menu</button></div>

<div class="ov" id="over"><h2 style="color:var(--ember)">The monster got you</h2><div class="card">Distance<b id="od"></b><br>Coins<b id="oc"></b><br>Best<b id="ob"></b></div>
<button class="go" id="again" style="font-size:24px">RUN AGAIN</button><button id="mm2">Main Menu</button></div>

<div class="ov" id="modal"><h2 id="mt"></h2><div class="card" id="mb"></div><button id="mx">Close</button></div>
</div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),x=cv.getContext('2d'),K='skyrunner_v1';
let W=0,H=0,S='menu',D={bank:0,best:0,scores:[],sound:true,daily:'',save:null};
try{Object.assign(D,JSON.parse(localStorage.getItem(K))||{})}catch(e){}

let ac;function snd(f,d=.1,ty='sine',v=.05,f2){if(!D.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+d)}catch(e){}}
function rs(){const r=cv.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,1.5);W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);
const hx=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16)),lp=(a,b,t)=>a+(b-a)*t;
const PAL=[{a:hx('#3d9bff'),b:hx('#ffe3a8'),c:255,s:hx('#d9c28a')},{a:hx('#5d7fa6'),b:hx('#c9d5e3'),c:220,s:hx('#a9a99a')},{a:hx('#040824'),b:hx('#2b2f78'),c:95,s:hx('#6d7396')}];
const NAMES=['Sunny','Cloudy','Moonlit'],ICO=['☀️','☁️','🌙'];
const ST=Array.from({length:50},()=>[Math.random(),Math.random()*.36,Math.random()*1.4+.5]);

let g;
function mk(l){g=Object.assign({t:0,dist:0,coins:0,lane:0,px:0,y:0,vy:0,sl:0,mon:0,mEnd:0,mt:0,gz:0,pt:[],inv:0,objs:[],mg:0,sh:0,bo:0,u:{m:1,s:1,b:1},fl:0,bn:0,ph:0,speed:12,w:[1,0,0],cur:{a:[...PAL[0].a],b:[...PAL[0].b],c:255,s:[...PAL[0].s]}},l||{});g.ph=Math.floor(g.t/30)%3;g.cur={a:[...PAL[g.ph].a],b:[...PAL[g.ph].b],c:PAL[g.ph].c,s:[...PAL[g.ph].s]};g.w=[0,0,0];g.w[g.ph]=1;g.nx=g.dist+25;refU()}

if(g.sh){g.sh=0;g.inv=.4;burst(px,py,'#5aa9ff',18);snd(220,.25,'sawtooth',.06,90);toast('Shield broke!');return}

function upd(dt){g.t+=dt;g.speed=(11+Math.min(g.t*.2,15))*(g.bo>0?1.55:1);g.dist+=g.speed*dt;g.px+=(g.lane-g.px)*Math.min(1,dt*14);
if(g.y>0||g.vy>0){g.vy-=40*dt;g.y+=g.vy*dt;if(g.y<=0){g.y=0;g.vy=0}}
['sl','inv','fl','bn','mg','bo'].forEach(k=>g[k]=Math.max(0,g[k]-dt));if(g.mon&&g.dist>=g.mEnd){g.mon=0;toast('You lost the monster!')}if(g.y<=0&&Math.random()<.5){const l=Math.min(W*.24,H*.15);g.pt.push({x:W/2+g.px*l+(Math.random()-.5)*24,y:H*.84,vx:(Math.random()-.5)*60,vy:-30-Math.random()*40,l:.45,c:'rgba(235,225,205,.5)',r:3,gv:60})}

for(const o of g.objs){if(o.dn)continue;const z=o.d-g.dist,dl=Math.abs(o.l-g.px);

if(Math.abs(z)>.6||dl>.6)continue;
if(o.k=='orb'){o.dn=1;g.u[o.t]++;refU();snd(600,.2,'triangle',.07,1200);toast('Power-up collected');continue}

else if(o.k=='bar'){if(g.sl<=0&&g.bo<=0){o.dn=1;g.gz=o.d+3;hit()}}
else if(g.bo<=0){o.dn=1;g.gz=o.d+3;hit()}}
g.objs=g.objs.filter(o=>o.d>g.dist-5)}
function wx(dt){g.pt.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=q.gv*dt;q.l-=dt});g.pt=g.pt.filter(q=>q.l>0);g.mt=lp(g.mt,g.mon?1:0,Math.min(1,dt*(g.mon?6:1.8)));const ph=Math.floor(g.t/30)%3;if(ph!=g.ph){g.ph=ph;if(S=='play'){g.bn=3.5;snd(300,.5,'triangle',.08,700)}}
const P=PAL[g.ph],k=Math.min(1,dt*1.2),c=g.cur;for(let i=0;i<3;i++){c.a[i]=lp(c.a[i],P.a[i],k);c.b[i]=lp(c.b[i],P.b[i],k);c.s[i]=lp(c.s[i],P.s[i],k);g.w[i]=lp(g.w[i],i==g.ph?1:0,k)}c.c=lp(c.c,P.c,k)}

else if(a=='D'){g.sl=.7;if(g.y>.01)g.vy=-22;snd(300,.12,'sine',.04,150)}}

function pause(){if(S!='play')return;S='pause';$('pd').textContent=(g.dist|0)+' m';$('pc').textContent=g.coins;const t=g.t|0;$('pt').textContent=String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0');show('pause')}

$('play').onclick=()=>start();$('cont').onclick=()=>start({dist:D.save.dist,coins:D.save.coins,t:D.save.t});$('again').onclick=()=>start();

$('mm').onclick=$('mm2').onclick=()=>{S='menu';mk();show('menu')};
$('mx').onclick=()=>$('modal').classList.remove('on');
$('daily').onclick=()=>{const d=new Date().toDateString();if(D.daily==d)modal('Daily reward','Already claimed today. Come back tomorrow for 50 more coins.');else{D.daily=d;D.bank+=50;sv();$('bank').textContent='🪙 '+D.bank;modal('Daily reward','You got 50 coins. Your bank: '+D.bank)}};
$('lb').onclick=()=>modal('Best runs',D.scores.length?D.scores.map((s,i)=>(i+1)+'. <b>'+s+' m</b>').join('<br>'):'No runs yet. Hit PLAY.');
$('set').onclick=()=>{modal('Settings','Sound <b id="sb" style="cursor:pointer">'+(D.sound?'On':'Off')+'</b><br>Reset all data <b id="rb" style="cursor:pointer;color:#ff7b6b">Reset</b>');$('sb').onclick=e=>{D.sound=!D.sound;e.target.textContent=D.sound?'On':'Off';sv()};$('rb').onclick=()=>{D={bank:0,best:0,scores:[],sound:true,daily:'',save:null};sv();show('menu');$('modal').classList.add('on');$('mb').textContent='Data cleared.'}};
document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();act(b.dataset.a)}));
document.querySelectorAll('[data-u]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();usep(b.dataset.u)}));
addEventListener('keydown',e=>{const k=e.key;if(k=='ArrowLeft'||k=='a')act('L');else if(k=='ArrowRight'||k=='d')act('R');else if(k=='ArrowUp'||k=='w'||k==' ')act('U');else if(k=='ArrowDown'||k=='s')act('D');else if(k=='p'||k=='Escape')S=='play'?pause():S=='pause'&&$('res').click();else if('123'.includes(k)&&k)usep('msb'[k-1]);if(k==' ')e.preventDefault()});
addEventListener('visibilitychange',()=>{if(document.hidden)pause()});

const mixc=(a,b,t)=>`rgb(${a.map((v,i)=>lp(v,b[i],t)|0).join()})`;
const hash=n=>{n=Math.sin(n*127.1)*43758.5;return n-Math.floor(n)};
const GC={},CC={};

function draw(){
const hor=H*.36,by=H*.84,cx=W/2,lw=Math.min(W*.24,H*.15),pr=z=>1/(1+z/9),Y=z=>hor+(by-hor)*pr(z),X=(l,z)=>cx+l*lw*pr(z),c=g.cur,w=g.w,t=g.t,cn=c.c,k=cn/255;
